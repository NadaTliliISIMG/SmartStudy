# NRPE commands available to Nagios (monitor-vm).
# They run on the monitored VM, as the "nagios" user. No arguments are accepted
# from the network (dont_blame_nrpe=0), which is the secure default.

# --- System (all VMs) ---
# CPU load per core: warning at 0.8 / 0.7 / 0.6, critical at 1.5 / 1.2 / 1.0 (1 / 5 / 15 min)
command[ss_load]=/usr/lib/nagios/plugins/check_load -r -w 0.8,0.7,0.6 -c 1.5,1.2,1.0
# Disk: warning below 20% free, critical below 10% free
command[ss_disk]=/usr/lib/nagios/plugins/check_disk -w 20% -c 10% -p /
# Memory: warning at 80% used, critical at 90% used
command[ss_mem]=/usr/lib/nagios/plugins/check_mem -w 80 -c 90

# --- Smart Study (app-vm only) ---
# The backend and the AI service listen on 127.0.0.1 only, so they are checked locally.
command[ss_backend]=/usr/lib/nagios/plugins/check_http -H 127.0.0.1 -p 5000 -u /api/health -e 200
command[ss_ai]=/usr/lib/nagios/plugins/check_http -H 127.0.0.1 -p 8000 -u /health -e 200
# MongoDB publishes no port: its health is read from Docker.
command[ss_mongo]=/usr/lib/nagios/plugins/check_docker_health smartstudy-mongo