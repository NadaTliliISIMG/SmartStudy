# Hosts monitored by Nagios. "monitor-vm" itself is already defined as "localhost"
# in /etc/nagios4/objects/localhost.cfg.

# Host template: ping every minute, 3 failures before DOWN
define host {
    name                    ss-host
    use                     linux-server
    check_command           ss_host_alive
    check_interval          1
    retry_interval          1
    max_check_attempts      3
    register                0
}

define host {
    use                     ss-host
    host_name               app-vm
    alias                   Smart Study application server
    address                 192.168.56.10
    hostgroups              smartstudy-vms
}

define host {
    use                     ss-host
    host_name               ci-vm
    alias                   Jenkins CI/CD server
    address                 192.168.56.11
    hostgroups              smartstudy-vms
}

define hostgroup {
    hostgroup_name          smartstudy-vms
    alias                   Smart Study virtual machines
}