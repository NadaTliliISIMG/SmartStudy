# Service template: check every minute, 3 failures before CRITICAL
define service {
    name                    ss-service
    use                     generic-service
    check_interval          1
    retry_interval          1
    max_check_attempts      3
    register                0
}

# ===================== app-vm =====================

# VM availability (network)
define service {
    use                     ss-service
    host_name               app-vm
    service_description     PING
    check_command           ss_ping!100.0,20%!500.0,60%
}

define service {
    use                     ss-service
    host_name               app-vm
    service_description     SSH
    check_command           ss_ssh
}

# CPU, memory, disk (through NRPE)
define service {
    use                     ss-service
    host_name               app-vm
    service_description     CPU load
    check_command           ss_nrpe!ss_load
}

define service {
    use                     ss-service
    host_name               app-vm
    service_description     Memory usage
    check_command           ss_nrpe!ss_mem
}

define service {
    use                     ss-service
    host_name               app-vm
    service_description     Disk usage
    check_command           ss_nrpe!ss_disk
}

# Application: frontend (reachable from the network on port 3000)
define service {
    use                     ss-service
    host_name               app-vm
    service_description     Frontend HTTP 3000
    check_command           ss_http!-p 3000
}

# Application: backend health endpoint, AI service health endpoint, MongoDB (through NRPE)
define service {
    use                     ss-service
    host_name               app-vm
    service_description     Backend /api/health
    check_command           ss_nrpe!ss_backend
}

define service {
    use                     ss-service
    host_name               app-vm
    service_description     AI service /health
    check_command           ss_nrpe!ss_ai
}

define service {
    use                     ss-service
    host_name               app-vm
    service_description     MongoDB
    check_command           ss_nrpe!ss_mongo
}

