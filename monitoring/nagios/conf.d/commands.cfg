# Check commands used by our hosts and services.
# They have their own "ss_" names so they never clash with the commands that
# Ubuntu's Nagios packages may already define. $USER1$ is /usr/lib/nagios/plugins.

# Host alive check: used to decide whether a VM is UP or DOWN
define command {
    command_name    ss_host_alive
    command_line    $USER1$/check_ping -H $HOSTADDRESS$ -w 3000.0,80% -c 5000.0,100% -p 1
}

# ICMP ping with thresholds: $ARG1$ = warning (rta,loss%), $ARG2$ = critical
define command {
    command_name    ss_ping
    command_line    $USER1$/check_ping -H $HOSTADDRESS$ -w $ARG1$ -c $ARG2$ -p 5
}

define command {
    command_name    ss_ssh
    command_line    $USER1$/check_ssh $ARG1$ $HOSTADDRESS$
}

# HTTP check: $ARG1$ = extra options, for example "-p 3000" or "-p 8080 -u /login"
define command {
    command_name    ss_http
    command_line    $USER1$/check_http -I $HOSTADDRESS$ $ARG1$
}

# Runs a command defined on the monitored VM (see monitoring/nagios/nrpe/smartstudy.cfg)
define command {
    command_name    ss_nrpe
    command_line    $USER1$/check_nrpe -H $HOSTADDRESS$ -c $ARG1$
}