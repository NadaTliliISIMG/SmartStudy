server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The browser only talks to nginx; /api is forwarded to the backend container.
    # "backend" is the Docker Compose service name.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # AI generation can take a while: the default 60 s would cut it
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Single-page app: unknown paths fall back to index.html (React Router)
    location / {
        try_files $uri /index.html;
    }
}